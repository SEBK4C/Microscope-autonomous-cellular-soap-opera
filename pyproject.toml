[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soapscope"
version = "0.1.0"
description = "Autonomous cellular soap opera: track microbes on a microscope slide and auto-caption their lives like a Gary Larson cartoon."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SoapScope contributors" }]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.optional-dependencies]
# Heavy / hardware backends, swapped in during later autoresearch iterations.
sam = ["torch", "torchvision"]          # SAM2 / SAM3 segmentation + tracking
llm = ["llama-cpp-python"]              # local LLM captioning
video = ["imageio", "imageio-ffmpeg", "opencv-python"]  # real video I/O
hardware = ["pyserial"]                # real CNC stage over serial
dev = ["pytest"]

[project.scripts]
soapscope = "soapscope.cli:main"

[tool.setuptools.packages.find]
include = ["soapscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
